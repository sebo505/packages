# yaml-language-server: $schema=/usr/share/ypkg/schema/schema.json
name       : gthumb
version    : 4.0.2
release    : 53
source     :
    - https://gitlab.gnome.org/GNOME/gthumb/-/archive/4.0.2/gthumb-4.0.2.tar.gz : 47a40ed504b099bf0db7d6159a26123eecbbfbcc9ebf86449f21e511c914bb37
homepage   : https://gitlab.gnome.org/GNOME/gthumb/
license    : GPL-2.0-or-later
component  : multimedia.graphics
summary    : Image viewer and browser utility
description: |
    gthumb is an application for viewing, editing, and organizing collections of images.
builddeps  :
    - pkgconfig(appstream)
    - pkgconfig(colord)
    - pkgconfig(exiv2)
    - pkgconfig(gsettings-desktop-schemas)
    - pkgconfig(gstreamer-plugins-base-1.0)
    - pkgconfig(gtk4)
    - pkgconfig(lcms2)
    - pkgconfig(libadwaita-1)
    - pkgconfig(libheif)
    - pkgconfig(libjpeg)
    - pkgconfig(libjxl)
    - pkgconfig(libportal)
    - pkgconfig(libportal-gtk4)
    - pkgconfig(libraw)
    - pkgconfig(librsvg-2.0)
    - pkgconfig(libssh)
    - pkgconfig(libtiff-4)
    - pkgconfig(libwebp)
    - desktop-file-utils
    - giflib-devel
    - itstool
    - vala
setup      : |
    %meson_configure
build      : |
    %meson_build
install    : |
    %meson_install
    %install_license COPYING
